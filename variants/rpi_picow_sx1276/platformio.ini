[rpi_picow_sx1276]
extends = rp2040_base
board = rpipicow
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags = ${rp2040_base.build_flags}
  -I variants/rpi_picow_sx1276
  -D P_LORA_DIO_0=22
  -D P_LORA_DIO_1=17
  -D P_LORA_NSS=21
  -D P_LORA_RESET=15
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=16
  -D P_LORA_MOSI=19
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
build_src_filter = ${rp2040_base.build_src_filter}
  +<PicoWBoard.cpp>
  +<../variants/rpi_picow_sx1276>
lib_deps = ${rp2040_base.lib_deps}

[env:PicoW_SX1276_repeater]
extends = rpi_picow_sx1276
build_flags = ${rpi_picow_sx1276.build_flags}
  -D ADVERT_NAME='"PicoW SX1276 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow_sx1276.build_src_filter}
  +<../examples/simple_repeater>

[env:PicoW_SX1276_room_server]
extends = rpi_picow_sx1276
build_flags = ${rpi_picow_sx1276.build_flags}
  -D ADVERT_NAME='"Test Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow_sx1276.build_src_filter}
  +<../examples/simple_room_server>

[env:PicoW_SX1276_companion_radio_usb]
extends = rpi_picow_sx1276
build_flags = ${rpi_picow_sx1276.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow_sx1276.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${rpi_picow_sx1276.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore = BLE

[env:PicoW_SX1276_terminal_chat]
extends = rpi_picow_sx1276
build_flags = ${rpi_picow_sx1276.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rpi_picow_sx1276.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps = ${rpi_picow_sx1276.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:PicoW_SX1276_kiss_modem]
extends = rpi_picow_sx1276
build_src_filter = ${rpi_picow_sx1276.build_src_filter}
  +<../examples/kiss_modem/>

[env:PicoW_SX1276_companion_radio_ble]
extends = rpi_picow_sx1276
build_flags = ${rpi_picow_sx1276.build_flags}
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
build_src_filter = ${rpi_picow_sx1276.build_src_filter}
  +<helpers/rp2040/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps = ${rpi_picow_sx1276.lib_deps}
  densaugeo/base64 @ ~1.4.0
extra_scripts = pre:patch_framework.py

name: Build and release PicoW SX1276 firmwares

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - PicoW_SX1276_repeater
          - PicoW_SX1276_room_server
          - PicoW_SX1276_companion_radio_usb
          - PicoW_SX1276_terminal_chat
          - PicoW_SX1276_kiss_modem
          - PicoW_SX1276_companion_radio_ble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'patches/BLEAdvertising.cpp') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Rename firmware with environment name
        run: |
          mkdir -p release-out
          for f in .pio/build/${{ matrix.environment }}/*.uf2 .pio/build/${{ matrix.environment }}/*.bin; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "release-out/${{ matrix.environment }}.$ext"
          done

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: release-out/*
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
